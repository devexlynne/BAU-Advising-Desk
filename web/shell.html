.track-course{font:600 11.5px var(--mono);padding:4px 7px;border-radius:999px;border:1px solid var(--line2);background:var(--surface)}
.track-course.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.track-course.now{border-color:var(--watch);background:var(--watch-soft);color:var(--watch)}

/* ---- room left in the trial schedule ---- */

/* ---- severity on the student list ---- */

/* ---- plan term switch ---- */
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---- notices ---- */
.pulse{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 22px}
.pulse-c{position:relative;padding:14px 16px 13px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.pulse-c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--muted)}
.pulse-c.urgent::before{background:var(--urgent)}.pulse-c.watch::before{background:var(--watch)}.pulse-c.info::before{background:var(--brand)}
.pulse-c b{display:block;font-size:30px;line-height:1.05;font-family:var(--display,Georgia),serif}
.pulse-c span{display:block;font-weight:700;margin-top:2px}.pulse-c i{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}

.notice{display:flex;flex-direction:column;gap:10px;padding:15px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--muted)}

.notice-top{display:flex;gap:12px;align-items:flex-start}
.notice-n{flex:0 0 auto;min-width:38px;height:38px;padding:0 8px;border-radius:var(--r);display:grid;place-items:center;font-weight:800;font-size:17px;background:var(--sunk)}

.notice h3{margin:0;font-size:15.5px;line-height:1.3}
.notice-rule{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.notice-act{font-size:13.5px;padding:9px 11px;border-radius:var(--r-sm);background:var(--sunk)}
.notice-act .lab{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.notice-who{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

button.more{all:unset;cursor:pointer;color:var(--brand);font-size:12.5px;font-weight:600}

/* ---- chain columns, pills, requirement summary ---- */

.cf-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.cf-h{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.cchip{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:7px 10px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line2)}
.cchip small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip.p{border-left-color:var(--ok)}.cchip.n{border-left-color:var(--watch)}.cchip.o{border-left-color:var(--brand)}.cchip.l{border-left-color:var(--urgent)}

/* ---- rules editor (admin) ---- */
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:13.5px}

.ptable-wrap{overflow-x:auto}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}

.ptable td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable tr.gone td{opacity:.45;text-decoration:line-through}
.effect{padding:12px 14px;border-radius:var(--r);border:1px solid var(--ok);background:var(--ok-soft);font-size:13.5px}

.rhist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rhist>li{border-left:3px solid var(--brand);padding:4px 0 4px 12px}
.rh-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13.5px}.rh-top span{color:var(--muted);font-size:12.5px}

/* ---- language toggle + Arabic/RTL fixes ---- */
.lang-btn{all:unset;cursor:pointer;display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:50%;font:700 14.5px var(--sans);color:inherit;opacity:.9}
.lang-btn:hover{background:rgba(255,255,255,.12)}
.lang-btn .ar{display:none;font-size:12.5px}
html[lang=ar] .lang-btn .en{display:none}html[lang=ar] .lang-btn .ar{display:inline}
.gate-lang{position:fixed;top:14px;inset-inline-end:16px;z-index:50;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
#app:not([hidden]) ~ .gate-lang, body:has(#app:not([hidden])) .gate-lang{display:none}

.bulk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}

.rchips{display:flex;flex-wrap:wrap;gap:8px}

  background:var(--surface);font-size:13.5px;font-family:var(--mono)}

.rchip i{font-style:normal;font-family:var(--sans);font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}

.tx-sum{display:flex;align-items:center;gap:26px;padding:14px 18px;border-radius:var(--r-lg);background:linear-gradient(120deg,var(--brand-soft),var(--surface));
  border:1px solid var(--line);margin-bottom:14px}

.roadmap-head{display:flex;align-items:flex-end;gap:30px;margin-bottom:14px;flex-wrap:wrap}
