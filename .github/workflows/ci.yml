# Runs on every push and pull request.
# Fails if the lockfile and package.json disagree (npm ci), if a dependency has a
# known high or critical vulnerability (npm audit), or if any test fails.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exactly what the lockfile says, with no install scripts
        run: npm ci --ignore-scripts

      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Build the page
        run: node build.js

      - name: Unit and server tests
        run: npm test

      - name: Browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Browser security test
        run: npm run test:security

      - name: Browser account e-mail test
        run: npm run test:email

      - name: Full walk-through
        run: npm run test:full
